<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs>
<filter id="sh" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#002959" flood-opacity="0.18"/></filter>
<marker id="ao" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#FF8B48"/></marker>
<marker id="ab" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#33547A"/></marker>
<linearGradient id="gnavy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#002959"/><stop offset="1" stop-color="#33547A"/></linearGradient>
<linearGradient id="gor" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#33547A"/><stop offset="1" stop-color="#FF8B48"/></linearGradient>
</defs>
<rect x="0" y="0" width="1000" height="520" rx="18" fill="#FFFFFF"/>
<text x="40" y="58" font-size="32" font-weight="700" fill="#002959" text-anchor="start"><tspan x="40" dy="0">Tehisintellekt → masinõpe → süvaõpe</tspan></text>
<rect x="40" y="72" width="90" height="6" rx="3" fill="#FF8B48"/>
<ellipse cx="380" cy="300" rx="330" ry="200" fill="#EEF2F7" stroke="#002959" stroke-width="3" filter="url(#sh)"/>
<ellipse cx="440" cy="330" rx="240" ry="145" fill="#CCD4DE" stroke="#33547A" stroke-width="3"/>
<ellipse cx="490" cy="355" rx="140" ry="85" fill="#FFE2D1" stroke="#FF8B48" stroke-width="3"/>
<text x="150" y="180" font-size="26" font-weight="700" fill="#002959" text-anchor="start"><tspan x="150" dy="0">Tehisintellekt</tspan></text>
<text x="260" y="240" font-size="24" font-weight="700" fill="#002959" text-anchor="start"><tspan x="260" dy="0">Masinõpe</tspan></text>
<text x="490" y="350" font-size="24" font-weight="700" fill="#002959" text-anchor="middle"><tspan x="490" dy="0">Süvaõpe</tspan></text>
<text x="490" y="380" font-size="18" font-weight="400" fill="#33547A" text-anchor="middle"><tspan x="490" dy="0">närvivõrgud</tspan></text>
<rect x="730" y="116" width="8" height="80" rx="4" fill="#002959"/>
<text x="752" y="142" font-size="21" font-weight="700" fill="#002959" text-anchor="start"><tspan x="752" dy="0">Tehisintellekt</tspan></text>
<text x="752" y="168" font-size="17" font-weight="400" fill="#33547A" text-anchor="start"><tspan x="752" dy="0">kõik masinad, mis jäljendavad</tspan><tspan x="752" dy="21">inimmõistust</tspan></text>
<rect x="730" y="251" width="8" height="80" rx="4" fill="#33547A"/>
<text x="752" y="277" font-size="21" font-weight="700" fill="#002959" text-anchor="start"><tspan x="752" dy="0">Masinõpe</tspan></text>
<text x="752" y="303" font-size="17" font-weight="400" fill="#33547A" text-anchor="start"><tspan x="752" dy="0">õpib andmetest, reegleid</tspan><tspan x="752" dy="21">ette ei kirjutata</tspan></text>
<rect x="730" y="386" width="8" height="80" rx="4" fill="#FF8B48"/>
<text x="752" y="412" font-size="21" font-weight="700" fill="#002959" text-anchor="start"><tspan x="752" dy="0">Süvaõpe</tspan></text>
<text x="752" y="438" font-size="17" font-weight="400" fill="#33547A" text-anchor="start"><tspan x="752" dy="0">mitmekihilised</tspan><tspan x="752" dy="21">närvivõrgud</tspan></text>

</svg>
