<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs>
<filter id="sh" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#002959" flood-opacity="0.18"/></filter>
<marker id="ao" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#FF8B48"/></marker>
<marker id="ab" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#33547A"/></marker>
<marker id="ag" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#2E8B57"/></marker>
<linearGradient id="gnavy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#002959"/><stop offset="1" stop-color="#33547A"/></linearGradient>
<linearGradient id="gtemp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#33547A"/><stop offset="1" stop-color="#FF8B48"/></linearGradient>
</defs>
<rect x="0" y="0" width="1000" height="660" rx="18" fill="#FFFFFF"/>
<text x="40" y="58" font-size="32" font-weight="700" fill="#002959">Kuidas vestlusrobot töötab</text>
<rect x="40" y="72" width="90" height="6" rx="3" fill="#FF8B48"/>
<rect x="40" y="100" width="620" height="64" rx="22" fill="#EEF2F7" filter="url(#sh)"/>
<text x="66" y="141" font-size="20" font-weight="700" fill="#002959" text-anchor="start"><tspan x="66" dy="0">Kasutaja: „Kas Tartu raamatukogu on laupäeval lahti?“</tspan></text>
<circle cx="700" cy="132" r="26" fill="#33547A"/><circle cx="700" cy="122" r="9" fill="#FFFFFF"/><path d="M684,148 Q700,128 716,148 z" fill="#FFFFFF"/>
<rect x="30" y="210" width="290" height="190" rx="14" fill="#EEF2F7" filter="url(#sh)"/>
<text x="50" y="248" font-size="22" font-weight="700" fill="#002959" text-anchor="start"><tspan x="50" dy="0">1. Keele mõistmine</tspan></text>
<text x="50" y="276" font-size="20" font-weight="700" fill="#FF8B48" text-anchor="start"><tspan x="50" dy="0">(NLU)</tspan></text>
<text x="50" y="312" font-size="19" font-weight="400" fill="#33547A" text-anchor="start"><tspan x="50" dy="0">kavatsus: lahtiolekuaeg</tspan><tspan x="50" dy="25">üksused: Tartu,</tspan><tspan x="50" dy="25">raamatukogu, laupäev</tspan></text>
<line x1="322" y1="305" x2="343" y2="305" stroke="#FF8B48" stroke-width="4" marker-end="url(#ao)"/>
<rect x="345" y="210" width="290" height="190" rx="14" fill="#FFF4EC" stroke="#FF8B48" stroke-width="2" filter="url(#sh)"/>
<text x="365" y="248" font-size="22" font-weight="700" fill="#002959" text-anchor="start"><tspan x="365" dy="0">2. Dialoogi haldamine</tspan></text>
<text x="365" y="312" font-size="19" font-weight="400" fill="#33547A" text-anchor="start"><tspan x="365" dy="0">jälgib vestluse olekut</tspan><tspan x="365" dy="25">ja konteksti, otsustab</tspan><tspan x="365" dy="25">järgmise sammu</tspan></text>
<line x1="637" y1="305" x2="658" y2="305" stroke="#FF8B48" stroke-width="4" marker-end="url(#ao)"/>
<rect x="660" y="210" width="290" height="190" rx="14" fill="#EEF2F7" filter="url(#sh)"/>
<text x="680" y="248" font-size="22" font-weight="700" fill="#002959" text-anchor="start"><tspan x="680" dy="0">3. Vastuse loomine</tspan></text>
<text x="680" y="276" font-size="20" font-weight="700" fill="#FF8B48" text-anchor="start"><tspan x="680" dy="0">(NLG)</tspan></text>
<text x="680" y="312" font-size="19" font-weight="400" fill="#33547A" text-anchor="start"><tspan x="680" dy="0">valmis mall või</tspan><tspan x="680" dy="25">keelemudel</tspan></text>
<line x1="175" y1="170" x2="175" y2="204" stroke="#FF8B48" stroke-width="4" marker-end="url(#ao)"/>
<path d="M225,470 L225,540 A120,22 0 0 0 465,540 L465,470 z" fill="#33547A"/>
<ellipse cx="345" cy="470" rx="120" ry="22" fill="#002959"/>
<text x="345" y="512" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="345" dy="0">Teadmusbaas</tspan></text>
<text x="345" y="538" font-size="18" font-weight="400" fill="#CCD4DE" text-anchor="middle"><tspan x="345" dy="0">KKK, lahtiolekuajad</tspan></text>
<line x1="345" y1="410" x2="345" y2="440" stroke="#FF8B48" stroke-width="4" marker-end="url(#ao)" marker-start="url(#ao)"/>
<line x1="805" y1="405" x2="805" y2="540" stroke="#FF8B48" stroke-width="4" marker-end="url(#ao)"/>
<rect x="400" y="548" width="560" height="80" rx="22" fill="#FFF4EC" stroke="#FF8B48" stroke-width="2" filter="url(#sh)"/>
<text x="424" y="582" font-size="20" font-weight="700" fill="#002959" text-anchor="start"><tspan x="424" dy="0">Robot: „Jah, laupäeval on raamatukogu</tspan></text>
<text x="424" y="610" font-size="20" font-weight="700" fill="#002959" text-anchor="start"><tspan x="424" dy="0">avatud kella 10–16.“</tspan></text>
<rect x="40" y="560" width="64" height="54" rx="12" fill="#002959"/><circle cx="60" cy="585" r="7" fill="#FF8B48"/><circle cx="84" cy="585" r="7" fill="#FF8B48"/><line x1="72" y1="548" x2="72" y2="560" stroke="#002959" stroke-width="4"/><circle cx="72" cy="546" r="5" fill="#FF8B48"/>
</svg>