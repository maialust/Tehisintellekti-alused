<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs>
<filter id="sh" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#002959" flood-opacity="0.18"/></filter>
<marker id="ao" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#FF8B48"/></marker>
<marker id="ab" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#33547A"/></marker>
<marker id="ag" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#2E8B57"/></marker>
<linearGradient id="gnavy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#002959"/><stop offset="1" stop-color="#33547A"/></linearGradient>
<linearGradient id="gtemp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#33547A"/><stop offset="1" stop-color="#FF8B48"/></linearGradient>
</defs>
<rect x="0" y="0" width="1000" height="560" rx="18" fill="#FFFFFF"/>
<text x="40" y="58" font-size="32" font-weight="700" fill="#002959">Keeletöötluse töövoog</text>
<rect x="40" y="72" width="90" height="6" rx="3" fill="#FF8B48"/>
<line x1="314.0" y1="200.0" x2="354.0" y2="200.0" stroke="#FF8B48" stroke-width="4" marker-end="url(#ao)"/>
<line x1="644.0" y1="200.0" x2="684.0" y2="200.0" stroke="#FF8B48" stroke-width="4" marker-end="url(#ao)"/>
<line x1="830.0" y1="294" x2="830.0" y2="354" stroke="#FF8B48" stroke-width="4" marker-end="url(#ao)"/>
<line x1="686.0" y1="450.0" x2="646.0" y2="450.0" stroke="#FF8B48" stroke-width="4" marker-end="url(#ao)"/>
<line x1="356.0" y1="450.0" x2="316.0" y2="450.0" stroke="#FF8B48" stroke-width="4" marker-end="url(#ao)"/>
<rect x="30.0" y="110" width="280" height="180" rx="14" fill="#EEF2F7" filter="url(#sh)"/>
<circle cx="64.0" cy="146" r="20" fill="#FF8B48"/><text x="64.0" y="153" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="64.0" dy="0">1</tspan></text>
<text x="96.0" y="153" font-size="22" font-weight="700" fill="#002959" text-anchor="start"><tspan x="96.0" dy="0">Kogumine ja</tspan><tspan x="96.0" dy="26">eeltöötlus</tspan></text>
<text x="52.0" y="223" font-size="19" font-weight="400" fill="#33547A" text-anchor="start"><tspan x="52.0" dy="0">Tekst:</tspan><tspan x="52.0" dy="25">„Mari läks kooli.“</tspan></text>
<rect x="360.0" y="110" width="280" height="180" rx="14" fill="#EEF2F7" filter="url(#sh)"/>
<circle cx="394.0" cy="146" r="20" fill="#FF8B48"/><text x="394.0" y="153" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="394.0" dy="0">2</tspan></text>
<text x="426.0" y="153" font-size="22" font-weight="700" fill="#002959" text-anchor="start"><tspan x="426.0" dy="0">Tokeniseerimine</tspan></text>
<text x="382.0" y="197" font-size="19" font-weight="400" fill="#33547A" text-anchor="start"><tspan x="382.0" dy="0">Tekst jagatakse osadeks:</tspan><tspan x="382.0" dy="25">Mari | läks | kooli | .</tspan></text>
<rect x="690.0" y="110" width="280" height="180" rx="14" fill="#EEF2F7" filter="url(#sh)"/>
<circle cx="724.0" cy="146" r="20" fill="#FF8B48"/><text x="724.0" y="153" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="724.0" dy="0">3</tspan></text>
<text x="756.0" y="153" font-size="22" font-weight="700" fill="#002959" text-anchor="start"><tspan x="756.0" dy="0">Lemmatiseerimine</tspan></text>
<text x="712.0" y="197" font-size="19" font-weight="400" fill="#33547A" text-anchor="start"><tspan x="712.0" dy="0">Sõnad algvormile:</tspan><tspan x="712.0" dy="25">kooli → kool</tspan></text>
<rect x="690.0" y="360" width="280" height="180" rx="14" fill="#EEF2F7" filter="url(#sh)"/>
<circle cx="724.0" cy="396" r="20" fill="#FF8B48"/><text x="724.0" y="403" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="724.0" dy="0">4</tspan></text>
<text x="756.0" y="403" font-size="22" font-weight="700" fill="#002959" text-anchor="start"><tspan x="756.0" dy="0">Sõnavektorite</tspan><tspan x="756.0" dy="26">loomine</tspan></text>
<text x="712.0" y="473" font-size="19" font-weight="400" fill="#33547A" text-anchor="start"><tspan x="712.0" dy="0">Sõnad muutuvad arvudeks:</tspan><tspan x="712.0" dy="25">kool → [0,2; 0,7; …]</tspan></text>
<rect x="360.0" y="360" width="280" height="180" rx="14" fill="#EEF2F7" filter="url(#sh)"/>
<circle cx="394.0" cy="396" r="20" fill="#FF8B48"/><text x="394.0" y="403" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="394.0" dy="0">5</tspan></text>
<text x="426.0" y="403" font-size="22" font-weight="700" fill="#002959" text-anchor="start"><tspan x="426.0" dy="0">Keelemudeli</tspan><tspan x="426.0" dy="26">rakendamine</tspan></text>
<text x="382.0" y="473" font-size="19" font-weight="400" fill="#33547A" text-anchor="start"><tspan x="382.0" dy="0">Mudel leiab tekstist</tspan><tspan x="382.0" dy="25">mustreid ja seoseid</tspan></text>
<rect x="30.0" y="360" width="280" height="180" rx="14" fill="#FFF4EC" stroke="#FF8B48" stroke-width="2" filter="url(#sh)"/>
<circle cx="64.0" cy="396" r="20" fill="#FF8B48"/><text x="64.0" y="403" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="64.0" dy="0">6</tspan></text>
<text x="96.0" y="403" font-size="22" font-weight="700" fill="#002959" text-anchor="start"><tspan x="96.0" dy="0">Tulemuste</tspan><tspan x="96.0" dy="26">analüüs</tspan></text>
<text x="52.0" y="473" font-size="19" font-weight="400" fill="#33547A" text-anchor="start"><tspan x="52.0" dy="0">Nt tõlge, kokkuvõte</tspan><tspan x="52.0" dy="25">või vastus</tspan></text>
</svg>