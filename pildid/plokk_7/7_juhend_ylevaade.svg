<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs><filter id="sh" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#002959" flood-opacity="0.18"/></filter></defs>
<rect x="0" y="0" width="1000" height="720" rx="18" fill="#FFFFFF"/>
<text x="40" y="58" font-size="32" font-weight="700" fill="#002959">Projektitöö ühe pilguga</text>
<rect x="40" y="72" width="90" height="6" rx="3" fill="#FF8B48"/>
<rect x="40" y="100" width="296" height="104" rx="16" fill="#F2F5FA" stroke="#CCD4DE" filter="url(#sh)"/>
<text x="60" y="132" font-size="17" fill="#33547A" font-weight="600">Rühm</text>
<text x="60" y="166" font-size="27" fill="#002959" font-weight="700">3–4 õpilast</text>
<text x="60" y="191" font-size="16" fill="#33547A">rollid ja töölogi</text>
<rect x="352" y="100" width="296" height="104" rx="16" fill="#F2F5FA" stroke="#CCD4DE" filter="url(#sh)"/>
<text x="372" y="132" font-size="17" fill="#33547A" font-weight="600">Aeg</text>
<text x="372" y="166" font-size="27" fill="#002959" font-weight="700">9 kontakttundi</text>
<text x="372" y="191" font-size="16" fill="#33547A">+ 4–6 h kodus</text>
<rect x="664" y="100" width="296" height="104" rx="16" fill="#F2F5FA" stroke="#CCD4DE" filter="url(#sh)"/>
<text x="684" y="132" font-size="17" fill="#33547A" font-weight="600">Valik</text>
<text x="684" y="166" font-size="27" fill="#002959" font-weight="700">3 rada</text>
<text x="684" y="191" font-size="16" fill="#33547A">6 töövormi</text>
<text x="40" y="250" font-size="20" font-weight="700" fill="#002959">Töö käik tundide kaupa</text>
<text x="91" y="282" font-size="15" text-anchor="middle" fill="#33547A" font-weight="600">1. tund</text>
<text x="193" y="282" font-size="15" text-anchor="middle" fill="#33547A" font-weight="600">2. tund</text>
<text x="296" y="282" font-size="15" text-anchor="middle" fill="#33547A" font-weight="600">3. tund</text>
<text x="398" y="282" font-size="15" text-anchor="middle" fill="#33547A" font-weight="600">4. tund</text>
<text x="500" y="282" font-size="15" text-anchor="middle" fill="#33547A" font-weight="600">5. tund</text>
<text x="602" y="282" font-size="15" text-anchor="middle" fill="#33547A" font-weight="600">6. tund</text>
<text x="704" y="282" font-size="15" text-anchor="middle" fill="#33547A" font-weight="600">7. tund</text>
<text x="807" y="282" font-size="15" text-anchor="middle" fill="#33547A" font-weight="600">8. tund</text>
<text x="909" y="282" font-size="15" text-anchor="middle" fill="#33547A" font-weight="600">9. tund</text>
<rect x="43" y="294" width="96" height="78" rx="12" fill="#002959"/>
<text x="91" y="328" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">Rühm, rada,</text>
<text x="91" y="350" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">teema</text>
<rect x="145" y="294" width="96" height="78" rx="12" fill="#33547A"/>
<text x="193" y="338" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">Tööplaan</text>
<rect x="247" y="294" width="198" height="78" rx="12" fill="#FF8B48"/>
<text x="347" y="328" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">Uurimine ja</text>
<text x="347" y="350" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">teostus I</text>
<rect x="452" y="294" width="96" height="78" rx="12" fill="#2E8B57"/>
<text x="500" y="328" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">Vahe-</text>
<text x="500" y="350" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">kontroll</text>
<rect x="554" y="294" width="96" height="78" rx="12" fill="#FF8B48"/>
<text x="602" y="328" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">Teostus II,</text>
<text x="602" y="350" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">testimine</text>
<rect x="656" y="294" width="96" height="78" rx="12" fill="#6B4FA0"/>
<text x="704" y="328" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">Viimistlus</text>
<text x="704" y="350" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">ja harjutus</text>
<rect x="759" y="294" width="198" height="78" rx="12" fill="#002959"/>
<text x="858" y="328" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">Esitlus ja</text>
<text x="858" y="350" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">tagasiside</text>
<rect x="145" y="384" width="607" height="14" rx="7" fill="#FFE2CC"/>
<text x="449" y="414" font-size="14" text-anchor="middle" fill="#33547A">kodus: allikad, mustandid, esitluse harjutamine (kokku 4–6 h)</text>
<text x="40" y="458" font-size="20" font-weight="700" fill="#002959">Kolm võrdväärset rada</text>
<rect x="40" y="472" width="296" height="74" rx="14" fill="#FFF4EC" stroke="#FF8B48" stroke-width="2"/>
<text x="56" y="502" font-size="18" font-weight="700" fill="#002959">A  Analüüs ja uurimine</text>
<text x="56" y="528" font-size="14" fill="#33547A">juhtumianalüüs, eetiline audit, debatt</text>
<rect x="352" y="472" width="296" height="74" rx="14" fill="#FFF4EC" stroke="#FF8B48" stroke-width="2"/>
<text x="368" y="502" font-size="18" font-weight="700" fill="#002959">B  Prototüüp</text>
<text x="368" y="528" font-size="14" fill="#33547A">paber/Figma, Teachable Machine, testiplaan</text>
<rect x="664" y="472" width="296" height="74" rx="14" fill="#FFF4EC" stroke="#FF8B48" stroke-width="2"/>
<text x="680" y="502" font-size="18" font-weight="700" fill="#002959">C  Arendus</text>
<text x="680" y="528" font-size="14" fill="#33547A">töötav mudel või rakendus, mõõdikud</text>
<text x="40" y="590" font-size="20" font-weight="700" fill="#002959">Hindamine</text>
<rect x="41" y="604" width="418" height="40" rx="8" fill="#002959"/>
<text x="250" y="630" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">õpetaja 70 %</text>
<rect x="461" y="604" width="118" height="40" rx="8" fill="#FF8B48"/>
<text x="520" y="630" font-size="13" text-anchor="middle" fill="#fff" font-weight="700">kaaslased 20 %</text>
<rect x="581" y="604" width="58" height="40" rx="8" fill="#2E8B57"/>
<text x="610" y="630" font-size="13" text-anchor="middle" fill="#fff" font-weight="700">ise 10 %</text>
<text x="40" y="676" font-size="15" fill="#33547A">Kriteeriumid: sisu, metoodika ja teostus, esitlus, aruanne, allikad (4 taset). Tehniline keerukus ei ole hinde eeltingimus.</text>
<text x="690" y="616" font-size="15" fill="#002959" font-weight="700">90–100 p = 5</text><text x="830" y="616" font-size="15" fill="#002959" font-weight="700">75–89 p = 4</text><text x="690" y="640" font-size="15" fill="#002959" font-weight="700">60–74 p = 3</text><text x="830" y="640" font-size="15" fill="#002959" font-weight="700">50–59 p = 2</text>
</svg>