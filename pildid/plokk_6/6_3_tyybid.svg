<text x="500.0" y="260" font-size="19" font-weight="400" fill="#33547A" text-anchor="middle"><tspan x="500.0" dy="0">tunnus, mis on</tspan><tspan x="500.0" dy="25">kaudselt seotud</tspan><tspan x="500.0" dy="25">nt sooga</tspan></text>
