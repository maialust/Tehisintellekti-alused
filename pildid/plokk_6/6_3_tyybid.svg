<text x="696.0" y="260" font-size="19" font-weight="400" fill="#33547A" text-anchor="middle"><tspan x="696.0" dy="0">tulemuste</tspan><tspan x="696.0" dy="25">järjekord</tspan><tspan x="696.0" dy="25">mõjutab usaldust</tspan></text>
