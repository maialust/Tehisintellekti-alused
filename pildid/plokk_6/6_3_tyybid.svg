<text x="892.0" y="260" font-size="19" font-weight="400" fill="#33547A" text-anchor="middle"><tspan x="892.0" dy="0">klõpsud</tspan><tspan x="892.0" dy="25">stereotüüpidele</tspan></text>
<text x="500" y="372" font-size="20" font-weight="700" fill="#E67E42" text-anchor="middle"><tspan x="500" dy="0">Kallutatus = süstemaatiline viga, mis kordub ja puudutab tihti kindlat rühma</tspan></text>
