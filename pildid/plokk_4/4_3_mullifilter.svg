<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs>
<filter id="sh" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#002959" flood-opacity="0.18"/></filter>
<marker id="ao" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#FF8B48"/></marker>
<marker id="ab" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#33547A"/></marker>
<marker id="ag" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#2E8B57"/></marker>
<marker id="agr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#CCD4DE"/></marker>
<linearGradient id="gnavy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#002959"/><stop offset="1" stop-color="#33547A"/></linearGradient>
<linearGradient id="gor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8B48"/><stop offset="1" stop-color="#E67E42"/></linearGradient>
</defs>
<rect x="0" y="0" width="1000" height="640" rx="18" fill="#FFFFFF"/>
<text x="40" y="58" font-size="32" font-weight="700" fill="#002959" text-anchor="start"><tspan x="40" dy="0">Kuidas tekib mullifilter?</tspan></text>
<rect x="40" y="72" width="90" height="6" rx="3" fill="#FF8B48"/>
<circle cx="500" cy="345" r="120" fill="#CCD4DE" opacity="0.5"/>
<circle cx="500" cy="345" r="88" fill="#CCD4DE" opacity="0.8"/>
<circle cx="500" cy="345" r="58" fill="#FF8B48" opacity="0.35"/>
<circle cx="500" cy="345" r="32" fill="#FF8B48" opacity="0.9"/>
<text x="500" y="357" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="500" dy="0">X</tspan></text>
<text x="500" y="253" font-size="20" font-weight="700" fill="#33547A" text-anchor="middle"><tspan x="500" dy="0">sinu voog</tspan></text>
<line x1="640" y1="160" x2="740" y2="236" stroke="#FF8B48" stroke-width="5" stroke-linecap="round" marker-end="url(#ao)"/>
<line x1="812" y1="324" x2="746" y2="480" stroke="#FF8B48" stroke-width="5" stroke-linecap="round" marker-end="url(#ao)"/>
<line x1="558" y1="525" x2="444" y2="525" stroke="#FF8B48" stroke-width="5" stroke-linecap="round" marker-end="url(#ao)"/>
<line x1="254" y1="480" x2="188" y2="324" stroke="#FF8B48" stroke-width="5" stroke-linecap="round" marker-end="url(#ao)"/>
<line x1="260" y1="236" x2="360" y2="160" stroke="#FF8B48" stroke-width="5" stroke-linecap="round" marker-end="url(#ao)"/>
<rect x="360.0" y="98.0" width="280" height="84" rx="14" fill="#FFF4EC" filter="url(#sh)"/>
<circle cx="364.0" cy="102.0" r="18" fill="#FF8B48"/>
<text x="364.0" y="109.2" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="364.0" dy="0">1</tspan></text>
<text x="506" y="134.5" font-size="20" font-weight="400" fill="#002959" text-anchor="middle"><tspan x="506" dy="0">Vaatad videot</tspan><tspan x="506" dy="25">teemal X</tspan></text>
<rect x="672.0" y="238.0" width="280" height="84" rx="14" fill="#EEF2F7" filter="url(#sh)"/>
<circle cx="676.0" cy="242.0" r="18" fill="#FF8B48"/>
<text x="676.0" y="249.2" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="676.0" dy="0">2</tspan></text>
<text x="818" y="274.5" font-size="20" font-weight="400" fill="#002959" text-anchor="middle"><tspan x="818" dy="0">Süsteem märkab:</tspan><tspan x="818" dy="25">„Talle meeldib X“</tspan></text>
<rect x="560.0" y="483.0" width="280" height="84" rx="14" fill="#FFF4EC" filter="url(#sh)"/>
<circle cx="564.0" cy="487.0" r="18" fill="#FF8B48"/>
<text x="564.0" y="494.2" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="564.0" dy="0">3</tspan></text>
<text x="706" y="519.5" font-size="20" font-weight="400" fill="#002959" text-anchor="middle"><tspan x="706" dy="0">Voog näitab rohkem</tspan><tspan x="706" dy="25">X-teemalisi videoid</tspan></text>
<rect x="160.0" y="483.0" width="280" height="84" rx="14" fill="#EEF2F7" filter="url(#sh)"/>
<circle cx="164.0" cy="487.0" r="18" fill="#FF8B48"/>
<text x="164.0" y="494.2" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="164.0" dy="0">4</tspan></text>
<text x="306" y="519.5" font-size="20" font-weight="400" fill="#002959" text-anchor="middle"><tspan x="306" dy="0">Vaatad neid,</tspan><tspan x="306" dy="25">sest muud ei paku</tspan></text>
<rect x="48.0" y="238.0" width="280" height="84" rx="14" fill="#FFF4EC" filter="url(#sh)"/>
<circle cx="52.0" cy="242.0" r="18" fill="#FF8B48"/>
<text x="52.0" y="249.2" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="52.0" dy="0">5</tspan></text>
<text x="194" y="274.5" font-size="20" font-weight="700" fill="#002959" text-anchor="middle"><tspan x="194" dy="0">Süsteem on veel</tspan><tspan x="194" dy="25">kindlam: „Ainult X!“</tspan></text>
<rect x="250" y="590" width="500" height="40" rx="20" fill="#002959"/>
<text x="500" y="617.0" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="500" dy="0">ring kordub ja mull muutub kitsamaks</tspan></text>
</svg>