<text x="500" y="145" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="500" dy="0">SAMMUD</tspan></text>
<text x="384" y="200" font-size="22" font-weight="700" fill="#002959" text-anchor="start"><tspan x="384" dy="0">Täpsed juhised</tspan></text>
<text x="384" y="240" font-size="20" font-weight="400" fill="#33547A" text-anchor="start"><tspan x="384" dy="0">1) sega kokku</tspan><tspan x="384" dy="25">2) küpseta 180 °C</tspan><tspan x="384" dy="25">    juures 25 min</tspan></text>
