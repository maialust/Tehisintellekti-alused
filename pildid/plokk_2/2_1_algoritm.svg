<text x="64" y="200" font-size="22" font-weight="700" fill="#002959" text-anchor="start"><tspan x="64" dy="0">Koostisained</tspan></text>
<text x="64" y="240" font-size="20" font-weight="400" fill="#33547A" text-anchor="start"><tspan x="64" dy="0">jahu, munad,</tspan><tspan x="64" dy="25">suhkur, piim</tspan></text>
