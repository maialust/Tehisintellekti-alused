<text x="820" y="145" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">VÄLJUND</tspan></text>
<text x="704" y="200" font-size="22" font-weight="700" fill="#002959" text-anchor="start"><tspan x="704" dy="0">Tulemus</tspan></text>
<text x="704" y="240" font-size="20" font-weight="400" fill="#33547A" text-anchor="start"><tspan x="704" dy="0">valmis kook</tspan></text>
