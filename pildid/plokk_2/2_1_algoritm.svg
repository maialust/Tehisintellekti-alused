<text x="70" y="388" font-size="20" font-weight="700" fill="#C0392B" text-anchor="start"><tspan x="70" dy="0">Arvutile ei sobi:</tspan></text>
<text x="250" y="388" font-size="20" font-weight="400" fill="#33547A" text-anchor="start"><tspan x="250" dy="0">„lisa veidi soola, küpseta, kuni on valmis“</tspan></text>
<text x="70" y="422" font-size="20" font-weight="700" fill="#2E8B57" text-anchor="start"><tspan x="70" dy="0">Arvutile sobib:</tspan></text>
<text x="250" y="422" font-size="20" font-weight="400" fill="#33547A" text-anchor="start"><tspan x="250" dy="0">„lisa 5 g soola, küpseta 180 °C juures 25 minutit“</tspan></text>
