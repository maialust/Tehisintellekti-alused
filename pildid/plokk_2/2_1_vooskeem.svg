<text x="500" y="350" font-size="21" font-weight="700" fill="#002959" text-anchor="middle"><tspan x="500" dy="0">Kas sajab või</tspan><tspan x="500" dy="26">tuleb vihma?</tspan></text>
<text x="600" y="306" font-size="20" font-weight="700" fill="#FF8B48" text-anchor="start"><tspan x="600" dy="0">← otsus (tingimus)</tspan></text>
