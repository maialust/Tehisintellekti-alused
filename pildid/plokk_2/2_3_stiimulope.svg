<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs>
<filter id="sh" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#002959" flood-opacity="0.18"/></filter>
<marker id="ao" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#FF8B48"/></marker>
<marker id="ab" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#33547A"/></marker>
<marker id="ag" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#2E8B57"/></marker>
<marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#C0392B"/></marker>
<linearGradient id="gnavy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#002959"/><stop offset="1" stop-color="#33547A"/></linearGradient>
<linearGradient id="gor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8B48"/><stop offset="1" stop-color="#E67E42"/></linearGradient>
</defs>
<rect x="0" y="0" width="1000" height="470" rx="18" fill="#FFFFFF"/>
<text x="40" y="58" font-size="32" font-weight="700" fill="#002959">Stiimulõpe: agent ja keskkond</text>
<rect x="40" y="72" width="90" height="6" rx="3" fill="#FF8B48"/>
<rect x="60" y="170" width="260" height="150" rx="14" fill="url(#gnavy)" filter="url(#sh)"/>
<text x="190" y="232" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="190" dy="0">AGENT</tspan></text>
<text x="190" y="266" font-size="20" font-weight="400" fill="#CCD4DE" text-anchor="middle"><tspan x="190" dy="0">(õppija)</tspan></text>
<rect x="680" y="170" width="260" height="150" rx="14" fill="#FFF4EC" stroke="#FF8B48" stroke-width="2" filter="url(#sh)"/>
<text x="810" y="232" font-size="28" font-weight="700" fill="#002959" text-anchor="middle"><tspan x="810" dy="0">KESKKOND</tspan></text>
<text x="810" y="266" font-size="20" font-weight="400" fill="#33547A" text-anchor="middle"><tspan x="810" dy="0">(mäng, maailm)</tspan></text>
<path d="M190,166 C190,100 810,100 810,160" stroke="#FF8B48" stroke-width="5" fill="none" marker-end="url(#ao)" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="360" y="92" width="280" height="44" rx="14" fill="#FFFFFF" stroke="#FF8B48" stroke-width="2"/>
<text x="500" y="121" font-size="20" font-weight="700" fill="#002959" text-anchor="middle"><tspan x="500" dy="0">tegevus: „liigu paremale“</tspan></text>
<path d="M810,324 C810,400 190,400 190,330" stroke="#2E8B57" stroke-width="5" fill="none" marker-end="url(#ag)" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="320" y="358" width="360" height="78" rx="14" fill="#FFFFFF" stroke="#2E8B57" stroke-width="2"/>
<text x="500" y="390" font-size="20" font-weight="700" fill="#2E8B57" text-anchor="middle"><tspan x="500" dy="0">uus olek + tasu (+1)</tspan></text>
<text x="500" y="420" font-size="20" font-weight="700" fill="#C0392B" text-anchor="middle"><tspan x="500" dy="0">või karistus (−1)</tspan></text>
<text x="500" y="250" font-size="20" font-weight="400" fill="#33547A" text-anchor="middle"><tspan x="500" dy="0">Kordub palju kordi:</tspan><tspan x="500" dy="26">agent õpib valima</tspan><tspan x="500" dy="26">suurima tasuga tegevusi</tspan></text>
</svg>
