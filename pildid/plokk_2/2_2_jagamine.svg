<text x="70" y="352" font-size="20" font-weight="400" fill="#002959" text-anchor="start"><tspan x="70" dy="0">Miks eraldi testandmed? Kui kontrolltöö ülesanded oleksid samad mis tunnis,</tspan></text>
<text x="70" y="380" font-size="20" font-weight="400" fill="#002959" text-anchor="start"><tspan x="70" dy="0">ei näeks õpetaja, kas said asjast aru või õppisid vastused pähe.</tspan></text>
