<rect x="554" y="190" width="190" height="130" rx="14" fill="url(#gnavy)" filter="url(#sh)"/>
<text x="649" y="228" font-size="20" font-weight="400" fill="#CCD4DE" text-anchor="middle"><tspan x="649" dy="0">kaalutud summa</tspan></text>
<text x="649" y="264" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="649" dy="0">3 + 2 + 0 − 2</tspan></text>
<text x="649" y="300" font-size="26" font-weight="700" fill="#FF8B48" text-anchor="middle"><tspan x="649" dy="0">= 3</tspan></text>
<line x1="748" y1="255" x2="790" y2="255" stroke="#FF8B48" stroke-width="4" marker-end="url(#ao)"/>
<rect x="796" y="170" width="180" height="170" rx="14" fill="#E6F3EC" stroke="#2E8B57" stroke-width="3" filter="url(#sh)"/>
<text x="886" y="210" font-size="22" font-weight="700" fill="#002959" text-anchor="middle"><tspan x="886" dy="0">3 &gt; 0 ?</tspan></text>
<text x="886" y="250" font-size="24" font-weight="700" fill="#2E8B57" text-anchor="middle"><tspan x="886" dy="0">JAH</tspan></text>
<text x="886" y="300" font-size="26" font-weight="700" fill="#2E8B57" text-anchor="middle"><tspan x="886" dy="0">LÄHEN!</tspan></text>
<rect x="554" y="400" width="422" height="120" rx="14" fill="#FFF4EC" stroke="#FF8B48" stroke-width="2" filter="url(#sh)"/>
<text x="574" y="436" font-size="20" font-weight="700" fill="#002959" text-anchor="start"><tspan x="574" dy="0">Kui kontrolltöö on tulemas (1):</tspan></text>
<text x="574" y="468" font-size="22" font-weight="700" fill="#E67E42" text-anchor="start"><tspan x="574" dy="0">3 + 2 − 4 − 2 = −1</tspan></text>
<text x="574" y="500" font-size="20" font-weight="400" fill="#002959" text-anchor="start"><tspan x="574" dy="0">−1 &lt; 0 → jään koju õppima</tspan></text>
</svg>
