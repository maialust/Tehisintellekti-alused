<text x="50" y="252" font-size="20" font-weight="700" fill="#002959" text-anchor="start"><tspan x="50" dy="0">ilm on ilus</tspan></text>
<text x="50" y="278" font-size="20" font-weight="400" fill="#33547A" text-anchor="start"><tspan x="50" dy="0">sisend</tspan></text>
