<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs>
<filter id="sh" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#002959" flood-opacity="0.18"/></filter>
<marker id="ao" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#FF8B48"/></marker>
<marker id="ab" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#33547A"/></marker>
<marker id="ag" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#2E8B57"/></marker>
<marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#C0392B"/></marker>
<linearGradient id="gnavy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#002959"/><stop offset="1" stop-color="#33547A"/></linearGradient>
<linearGradient id="gor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8B48"/><stop offset="1" stop-color="#E67E42"/></linearGradient>
</defs>
<rect x="0" y="0" width="1000" height="480" rx="18" fill="#FFFFFF"/>
<text x="40" y="58" font-size="32" font-weight="700" fill="#002959">Inimese ja tehisintellekti koostöö</text>
<rect x="40" y="72" width="90" height="6" rx="3" fill="#FF8B48"/>
<rect x="30" y="110" width="300" height="330" rx="14" fill="#FFF4EC" stroke="#FF8B48" stroke-width="2" filter="url(#sh)"/>
<ellipse cx="180" cy="170" rx="34" ry="18" fill="#FFFFFF" stroke="#002959" stroke-width="4"/>
<circle cx="180" cy="170" r="10" fill="#FF8B48"/>
<text x="180" y="236" font-size="24" font-weight="700" fill="#002959" text-anchor="middle"><tspan x="180" dy="0">TI-süsteem</tspan></text>
<text x="180" y="276" font-size="20" font-weight="400" fill="#33547A" text-anchor="middle"><tspan x="180" dy="0">vaatab sadu ülesvõtteid</tspan><tspan x="180" dy="26">kiiresti läbi ja märgib</tspan><tspan x="180" dy="26">kahtlased kohad</tspan></text>
<text x="180" y="400" font-size="20" font-weight="700" fill="#E67E42" text-anchor="middle"><tspan x="180" dy="0">kiirus, järjekindlus</tspan></text>
<line x1="336" y1="275" x2="370" y2="275" stroke="#FF8B48" stroke-width="5" marker-end="url(#ao)"/>
<rect x="376" y="200" width="248" height="150" rx="14" fill="url(#gnavy)" filter="url(#sh)"/>
<text x="500" y="254" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="500" dy="0">Arst vaatab</tspan></text>
<text x="500" y="284" font-size="20" font-weight="400" fill="#CCD4DE" text-anchor="middle"><tspan x="500" dy="0">üle keerulised</tspan></text>
<text x="500" y="310" font-size="20" font-weight="400" fill="#CCD4DE" text-anchor="middle"><tspan x="500" dy="0">juhtumid</tspan></text>
<line x1="630" y1="275" x2="664" y2="275" stroke="#FF8B48" stroke-width="5" marker-end="url(#ao)"/>
<rect x="670" y="110" width="300" height="330" rx="14" fill="#E6F3EC" stroke="#2E8B57" stroke-width="2" filter="url(#sh)"/>
<circle cx="820" cy="165" r="28" fill="#2E8B57"/>
<path d="M806,166 L816,178 L836,154" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="820" y="236" font-size="24" font-weight="700" fill="#002959" text-anchor="middle"><tspan x="820" dy="0">Otsus: arst</tspan></text>
<text x="820" y="276" font-size="20" font-weight="400" fill="#33547A" text-anchor="middle"><tspan x="820" dy="0">arst teeb otsuse ja</tspan><tspan x="820" dy="26">vastutab selle eest</tspan></text>
<text x="820" y="400" font-size="20" font-weight="700" fill="#2E8B57" text-anchor="middle"><tspan x="820" dy="0">kogemus, kontekst,</tspan><tspan x="820" dy="24">vastutustunne</tspan></text>
</svg>
